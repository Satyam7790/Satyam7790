
name: Update Favourite Language Statistics

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    paths:
      - "scripts/generate-language-stats.mjs"
      - ".github/workflows/language-stats.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate language statistics
        run: node scripts/generate-language-stats.mjs
        env:
          GITHUB_USERNAME: Satyam7790

      - name: Commit updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/favourite-languages.svg

          if git diff --cached --quiet; then
            echo "No changes to language statistics."
            exit 0
          fi

          git commit -m "Update favourite language statistics"
          git push
